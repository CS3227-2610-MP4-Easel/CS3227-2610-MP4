name: CI

on:
  pull_request:
    branches: [development, main]

permissions: {}

env:
  NODE_VERSION: 20.19.5
  NPM_VERSION: 10.8.2
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agile_platform

jobs:
  workspace:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: agile_platform
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm --workspace @agile/db run prisma:generate
      - name: Apply database migrations
        run: npm --workspace @agile/db exec prisma migrate deploy -- --schema prisma/schema.prisma
      - name: Run workspace tests, including database regressions
        env:
          W1_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agile_platform?connection_limit=25
        run: |
          test -n "$W1_INTEGRATION_DATABASE_URL"
          npm test

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm --workspace @agile/db run prisma:generate
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm --workspace @agile/db run prisma:generate
      - run: npm run lint

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm run contract

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 120 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar --extract --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm run scan:secrets -- --base-sha "${{ github.event.pull_request.base.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}"

  workflow-security-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci --ignore-scripts
      - run: npm run check:workflows -- --base-sha "${{ github.event.pull_request.base.sha }}" --base-branch "${{ github.event.pull_request.base.ref }}" --pr-number "${{ github.event.pull_request.number }}" --bootstrap-pr-number "${{ vars.W12_BOOTSTRAP_PR_NUMBER }}"
      - run: npm run check:agent-policy
