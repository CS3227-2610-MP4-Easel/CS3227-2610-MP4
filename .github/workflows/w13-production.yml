name: W13 production

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  APP_TIER: prod
  VERCEL_ENV: production
  NEON_HOST: ep-summer-heart-b3767eul-pooler.c-4.ap-southeast-1.aws.neon.tech
  NEON_PROJECT: super-sunset-36592949

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --workspace @agile/db run prisma:generate
      - run: npm run typecheck
      - run: npm --workspace easel-fe run build
      - name: Migrate production database
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: node --import tsx scripts/w13/migrate-production.mjs
      - name: Request Vercel deploy hook
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST --url "$VERCEL_DEPLOY_HOOK_URL"
