name: W13 development deployment check

on:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx scripts/w13/verify-dev-deployment.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_PROJECT_ID: agile-platform
          VERCEL_ALIAS: development
      - run: node --import tsx --test tests/w13/dev-deployment.test.ts
